<style>
:root{
  /* Layout: una columna de tarjetas para usar con una mano, barra de pestañas fija abajo */
  --bg:#EEF1F5; --surface:#FFFFFF; --ink:#15212E; --muted:#5C6B7A; --line:#D5DCE4;
  --accent:#1D4FD7; --accent-ink:#FFFFFF; --accent-soft:#E3EAFB;
  --good:#1B7F4B; --good-soft:#DDF2E6; --warn:#A35A00; --warn-soft:#FBEBD2; --bad:#B3261E;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E151D; --surface:#17212C; --ink:#E8EDF2; --muted:#93A1B0; --line:#2A3746;
    --accent:#6C96FF; --accent-ink:#0B1220; --accent-soft:#1C2B49;
    --good:#58C98A; --good-soft:#143524; --warn:#F0B35A; --warn-soft:#3A2A10; --bad:#FF8A80;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E151D; --surface:#17212C; --ink:#E8EDF2; --muted:#93A1B0; --line:#2A3746;
  --accent:#6C96FF; --accent-ink:#0B1220; --accent-soft:#1C2B49;
  --good:#58C98A; --good-soft:#143524; --warn:#F0B35A; --warn-soft:#3A2A10; --bad:#FF8A80;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:28px;line-height:1.05}
h2{font-size:22px;line-height:1.1}
h3{font-size:19px;line-height:1.15}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 16px max(16px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:14px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.sub{color:var(--muted);font-size:14px}
.status{font-size:13px;color:var(--muted);text-align:right;min-height:18px}
.status.bad{color:var(--bad)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;min-height:40px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.sm{padding:4px 10px;min-height:32px;font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.note{border-radius:10px;padding:10px 12px;font-size:14px}
.note.info{background:var(--accent-soft)}
.note.plain{background:var(--bg);color:var(--muted)}
.warm{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.idle{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.target{font-variant-numeric:tabular-nums;font-weight:600}
.last{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.sets{display:grid;grid-template-columns:28px 1fr 1fr 1fr;gap:6px 8px;align-items:center}
.sets .h{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.sets .n{font-family:var(--display);font-size:20px;color:var(--muted);text-align:center}
input[type=text],input[type=date],select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;min-height:44px;font-variant-numeric:tabular-nums}
.sets input{text-align:center;font-size:18px;font-weight:600}
textarea{min-height:70px;resize:vertical}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:600;min-height:44px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
details summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--accent)}
details ul{margin:8px 0 0;padding-left:18px;font-size:14px;display:flex;flex-direction:column;gap:4px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.tile .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.tile .v{font-family:var(--display);font-size:32px;line-height:1.1;font-variant-numeric:tabular-nums}
.tile .d{font-size:13px;color:var(--muted)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.form .full{grid-column:1/-1}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}
th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.scroll{overflow-x:auto}
svg{display:block;width:100%;height:auto}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:5;padding-bottom:env(safe-area-inset-bottom)}
.nav div{display:flex;width:100%;max-width:560px}
.nav a{flex:1;text-align:center;padding:14px 4px 16px;text-decoration:none;color:var(--muted);font-weight:600;font-size:14px;border-top:3px solid transparent}
.nav a[aria-current="page"]{color:var(--accent);border-top-color:var(--accent)}
.timer{position:fixed;left:16px;right:16px;bottom:calc(72px + env(safe-area-inset-bottom));max-width:528px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 14px;display:none;justify-content:space-between;align-items:center;z-index:6}
.timer.on{display:flex}
.timer .t{font-family:var(--display);font-size:30px;font-variant-numeric:tabular-nums}
.timer button{background:transparent;border:1px solid currentColor;color:inherit;border-radius:10px;padding:8px 12px;min-height:40px}
.empty{color:var(--muted);font-size:14px}
@media (prefers-reduced-motion:no-preference){.chip,.btn{transition:background-color .15s}}
</style>
</head>

/* ---------- utilidades ---------- */
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function ymd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function parseD(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2]);}
function addDays(s,n){var d=parseD(s);d.setDate(d.getDate()+n);return ymd(d);}
function monday(s){var d=parseD(s);var w=(d.getDay()+6)%7;return addDays(s,-w);}
function weekNo(s){return Math.floor((parseD(monday(s))-parseD(START))/(7*864e5))+1;}
function shortD(s){var d=parseD(s);return d.getDate()+" "+["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"][d.getMonth()];}
function num(v){if(v==null)return null;v=String(v).trim().replace(",",".");if(v==="")return null;var n=Number(v);return isFinite(n)?n:null;}
function fmt(n){return n==null?"":String(Math.round(n*100)/100);}
function clone(o){return JSON.parse(JSON.stringify(o));}
function todayDay(){var w=new Date().getDay();return w>=1&&w<=5?DAYS[w-1]:"lun";}

/* ---------- consultas ---------- */
function doneSets(doc){var n=0;if(doc&&doc.ejercicios)for(var k in doc.ejercicios){(doc.ejercicios[k].series||[]).forEach(function(s){if(s&&s.reps!=null)n++;});}return n;}
function history(exId){
  var out=[];
  Object.keys(S.ses).sort().forEach(function(k){
    var doc=S.ses[k],x=doc&&doc.ejercicios&&doc.ejercicios[exId];
    if(!x)return;var sets=(x.series||[]).filter(function(s){return s&&s.reps!=null;});
    if(sets.length)out.push({fecha:doc.fecha||k.slice(0,10),variante:x.variante||"A",sets:sets});
  });
  return out;
}
function lastBefore(exId,date){var h=history(exId).filter(function(r){return r.fecha<date;});return h.length?h[h.length-1]:null;}
function topSet(sets){var t=null;sets.forEach(function(s){if(s.kg==null)return;if(!t||s.kg>t.kg||(s.kg===t.kg&&s.reps>t.reps))t=s;});return t;}
function setsText(sets){
  var kgs=sets.map(function(s){return s.kg;});var same=kgs.every(function(k){return k===kgs[0];});
  if(same&&kgs[0]!=null)return fmt(kgs[0])+" kg × "+sets.map(function(s){return s.reps;}).join(", ");
  return sets.map(function(s){return (s.kg!=null?fmt(s.kg)+" kg × ":"")+s.reps;}).join(" · ");
}
function advice(e,last,variante){
  if(!last)return {t:"Primera vez: elige un peso que te deje 3 repeticiones en reserva.",c:"idle"};
  if(last.variante!==variante)return {t:"Cambiaste de variante: calibra el peso de nuevo.",c:"idle"};
  var full=last.sets.length>=e.s&&last.sets.every(function(s){return s.reps>=e.hi;});
  if(full)return {t:"Sube el peso y vuelve a "+e.lo+" o "+(e.lo+1)+" repeticiones.",c:"good"};
  return {t:"Mismo peso. Busca una repetición más en alguna serie.",c:"warn"};
}

/* ---------- gráfica ---------- */
function chart(pts,unit){
  if(pts.length<2)return '<p class="empty">Registra al menos dos fechas para ver la gráfica.</p>';
  var W=340,H=150,L=38,R=44,T=14,B=24;
  var ys=pts.map(function(p){return p.y;}),mn=Math.min.apply(null,ys),mx=Math.max.apply(null,ys);
  if(mn===mx){mn-=1;mx+=1;}var pad=(mx-mn)*0.12;mn-=pad;mx+=pad;
  function X(i){return L+(W-L-R)*i/(pts.length-1);}function Y(v){return T+(H-T-B)*(1-(v-mn)/(mx-mn));}
  var d=pts.map(function(p,i){return (i?"L":"M")+X(i).toFixed(1)+" "+Y(p.y).toFixed(1);}).join(" ");
  var area=d+" L"+X(pts.length-1).toFixed(1)+" "+(H-B)+" L"+L+" "+(H-B)+" Z";
  var g="";[0,0.5,1].forEach(function(f){var v=mn+(mx-mn)*f,y=Y(v);g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)" stroke-width="1"/><text x="'+(L-6)+'" y="'+(y+4)+'" text-anchor="end" font-size="11" fill="var(--muted)">'+fmt(Math.round(v*10)/10)+'</text>';});
  var last=pts[pts.length-1];
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Evolución en '+esc(unit)+'">'+g+
   '<path d="'+area+'" fill="var(--accent-soft)"/><path d="'+d+'" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>'+
   '<circle cx="'+X(pts.length-1)+'" cy="'+Y(last.y)+'" r="4.5" fill="var(--accent)"/>'+
   '<text x="'+(X(pts.length-1)+8)+'" y="'+(Y(last.y)+4)+'" font-size="12" font-weight="600" fill="var(--ink)">'+fmt(last.y)+'</text>'+
   '<text x="'+L+'" y="'+(H-6)+'" font-size="11" fill="var(--muted)">'+esc(pts[0].x)+'</text>'+
   '<text x="'+(W-R)+'" y="'+(H-6)+'" text-anchor="end" font-size="11" fill="var(--muted)">'+esc(last.x)+'</text></svg>';
}

function avg(a){return a.length?a.reduce(function(x,y){return x+y;},0)/a.length:null;}
function weekData(m){
  var days=[],sets=0,ses=0;
  DAYS.forEach(function(d,i){var date=addDays(m,i),doc=S.ses[date+"_"+d],n=doneSets(doc);
    if(!n){Object.keys(S.ses).forEach(function(k){var o=S.ses[k];if(o&&o.dia===d&&o.fecha>=m&&o.fecha<=addDays(m,6)&&doneSets(o)>n){doc=o;n=doneSets(o);}});}
    var tot=PROG[d].ex.reduce(function(a,e){return a+e.s;},0);if(n)ses++;sets+=n;days.push({d:d,doc:doc,n:n,tot:tot});});
  var bs=[];for(var i=0;i<7;i++){var b=S.body[addDays(m,i)];if(b)bs.push(b);}
  function col(k){return bs.map(function(b){return b[k];}).filter(function(v){return v!=null;});}
  var cin=col("cintura");
  return {days:days,sets:sets,ses:ses,peso:avg(col("peso")),sueno:avg(col("sueno")),fatiga:avg(col("fatiga")),cintura:cin.length?cin[cin.length-1]:null};
}

   "Cintura: "+(w.cintura!=null?fmt(w.cintura)+" cm":"sin dato")+" · Sueño: "+(w.sueno!=null?fmt(Math.round(w.sueno*10)/10)+" h":"sin dato")+" · Fatiga: "+(w.fatiga!=null?fmt(Math.round(w.fatiga*10)/10):"sin dato"),""];
  w.days.forEach(function(x){

  var d=$("bFecha").value,msg=$("bMsg");if(!d)return;
  var body={fecha:d,peso:num($("bPeso").value),sueno:num($("bSueno").value),cintura:num($("bCintura").value),fatiga:num($("bFatiga").value),brazoRel:num($("bRel").value),brazoCon:num($("bCon").value)};
  S.body[d]=body;msg.textContent=persist("body")?"Guardado":"No se pudo guardar.";
}

/* ---------- temporizador ---------- */
var tEnd=0,tInt=null;
function startTimer(sec){tEnd=Date.now()+sec*1000;$("timer").classList.add("on");clearInterval(tInt);tick();tInt=setInterval(tick,250);}
function tick(){var r=Math.max(0,Math.ceil((tEnd-Date.now())/1000));$("timerT").textContent=Math.floor(r/60)+":"+String(r%60).padStart(2,"0");
  if(r<=0){clearInterval(tInt);$("timerT").textContent="Listo";try{if(navigator.vibrate)navigator.vibrate(300);}catch(e){}setTimeout(function(){if(Date.now()>=tEnd)$("timer").classList.remove("on");},4000);}}
$("timerStop").addEventListener("click",function(){clearInterval(tInt);$("timer").classList.remove("on");});

window.addEventListener("hashchange",route);
loadLocal();
route();
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}
</script>
